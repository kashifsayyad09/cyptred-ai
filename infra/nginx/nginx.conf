worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_id":"$http_x_request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Security: hide Nginx version ──────────────────────────────────────────
    server_tokens off;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ── Request size limits ───────────────────────────────────────────────────
    client_max_body_size    10m;
    client_body_timeout     12s;
    client_header_timeout   12s;
    send_timeout            10s;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone $binary_remote_addr zone=events:10m  rate=120r/m;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ── Geo/IP block (placeholder — uncomment with ngx_http_geo_module) ───────
    # geo $blocked_ip {
    #     default         0;
    #     # 10.0.0.0/8   1;   # Example: block internal range if exposed publicly
    # }

    # ── HTTP server (redirect to HTTPS in production) ─────────────────────────
    server {
        listen 80;
        server_name _;

        # Health probes must work over plain HTTP for ECS/EC2 health checks
        location = /health {
            proxy_pass         http://backend/health;
            proxy_set_header   Host $host;
            proxy_read_timeout 5s;
        }

        location = /ready {
            proxy_pass         http://backend/ready;
            proxy_set_header   Host $host;
            proxy_read_timeout 10s;
        }

        # In production redirect all other HTTP → HTTPS
        # Uncomment when TLS is active:
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Development/local: serve directly without TLS
        include /etc/nginx/conf.d/locations.conf;
    }

    # ── HTTPS server (enable in production with valid certs) ──────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your.domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_stapling        on;
    #     ssl_stapling_verify on;
    #
    #     include /etc/nginx/conf.d/locations.conf;
    # }
}
