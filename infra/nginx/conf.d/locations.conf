# ── Shared location blocks ────────────────────────────────────────────────────
# Included by both the HTTP and HTTPS server blocks in nginx.conf.
# This file must NOT contain listen/server_name directives.

# ── Security headers (applied to all responses through this server) ───────────
add_header X-Frame-Options          "DENY"                              always;
add_header X-Content-Type-Options   "nosniff"                          always;
add_header X-XSS-Protection         "1; mode=block"                    always;
add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# HSTS — only add when TLS is actually terminated here
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ── Block internal Prometheus metrics endpoint ─────────────────────────────────
# /metrics is scraped by Prometheus directly over the internal Docker network.
# It MUST NOT be reachable from the public internet through Nginx.
location = /metrics {
    deny all;
    return 403;
}

# ── Block internal service ports from leaking ─────────────────────────────────
location ~ ^/(mcp|rag)/ {
    deny all;
    return 403;
}

# ── Auth — strict rate limit ──────────────────────────────────────────────────
location /api/v1/auth/ {
    limit_req             zone=auth burst=5 nodelay;
    limit_req_status      429;

    proxy_pass            http://backend;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_read_timeout    15s;
}

# ── Event ingestion — higher burst allowed ────────────────────────────────────
location /api/v1/events {
    limit_req             zone=events burst=60 nodelay;
    limit_req_status      429;

    proxy_pass            http://backend;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_read_timeout    10s;
}

# ── General API ───────────────────────────────────────────────────────────────
location /api/ {
    limit_req             zone=api burst=20 nodelay;
    limit_req_status      429;

    proxy_pass            http://backend;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_read_timeout    30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout    10s;
}

# ── Frontend SPA ──────────────────────────────────────────────────────────────
location / {
    proxy_pass            http://frontend;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_read_timeout    15s;

    # SPA: return index.html for unknown paths so React Router handles routing
    proxy_intercept_errors on;
    error_page 404 = /;
}
