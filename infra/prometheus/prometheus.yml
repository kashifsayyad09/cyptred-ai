global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  - job_name: 'mcp'
    static_configs:
      - targets: ['mcp:8001']
    metrics_path: '/metrics'

  - job_name: 'rag'
    static_configs:
      - targets: ['rag:8002']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
