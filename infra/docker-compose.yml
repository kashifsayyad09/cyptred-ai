version: '3.9'

services:
  # ── Reverse Proxy ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - exam-guardian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    networks:
      - exam-guardian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL}
      - MCP_HOST=mcp
      - MCP_PORT=8001
      - MCP_SECRET=${MCP_SECRET}
      - RAG_HOST=rag
      - RAG_PORT=8002
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      - mcp
      - rag
    networks:
      - exam-guardian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MCP Server ────────────────────────────────────────────────────────────────
  mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    expose:
      - "8001"
    environment:
      - MCP_SECRET=${MCP_SECRET}
      - RISK_WEIGHT_TAB_SWITCH=${RISK_WEIGHT_TAB_SWITCH:-10}
      - RISK_WEIGHT_FOCUS_LOSS=${RISK_WEIGHT_FOCUS_LOSS:-5}
      - RISK_WEIGHT_COPY=${RISK_WEIGHT_COPY:-15}
      - RISK_WEIGHT_PASTE=${RISK_WEIGHT_PASTE:-15}
      - RISK_WEIGHT_FULLSCREEN_EXIT=${RISK_WEIGHT_FULLSCREEN_EXIT:-10}
      - RISK_WEIGHT_SUSPICIOUS_NAVIGATION=${RISK_WEIGHT_SUSPICIOUS_NAVIGATION:-20}
      - RISK_WEIGHT_AI_ASSISTANT_SIGNAL=${RISK_WEIGHT_AI_ASSISTANT_SIGNAL:-25}
      - RISK_WEIGHT_REPEATED_VIOLATIONS=${RISK_WEIGHT_REPEATED_VIOLATIONS:-20}
      - RISK_WEIGHT_SUSPICIOUS_SEQUENCE=${RISK_WEIGHT_SUSPICIOUS_SEQUENCE:-20}
    networks:
      - exam-guardian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── RAG Engine ────────────────────────────────────────────────────────────────
  rag:
    build:
      context: ../rag
      dockerfile: Dockerfile
    expose:
      - "8002"
    volumes:
      - rag-vectorstore:/app/rag/vectorstore
    environment:
      - RAG_VECTOR_STORE_PATH=/app/rag/vectorstore
    networks:
      - exam-guardian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - exam-guardian-net
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - exam-guardian-net
    restart: unless-stopped

networks:
  exam-guardian-net:
    driver: bridge

volumes:
  rag-vectorstore:
  prometheus-data:
  grafana-data:
