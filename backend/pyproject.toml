[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-exam-guardian-backend"
version = "0.1.0"
description = "AI Exam Guardian — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "sqlalchemy==2.0.30",
    "aiomysql==0.2.0",
    "alembic==1.13.1",
    "httpx==0.27.0",
    "tenacity==8.3.0",
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "ruff==0.4.4",
]
